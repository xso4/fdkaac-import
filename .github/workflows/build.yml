name: Build Windows Static

on:
  workflow_dispatch:
  schedule:
    - cron: '41 12 11 * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check_updates.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check for updates
        id: check_updates
        run: python .github/scripts/check_updates.py

  build:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: windows-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEFAULT_BRANCH }}

      - name: Sync with upstream (fdkaac)
        shell: powershell
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          $ls = git ls-remote --symref https://github.com/nu774/fdkaac.git HEAD
          $refLine = ($ls -split "`n" | Where-Object { $_ -match '^ref: refs/heads/' })
          if (-not $refLine) { Write-Error "Failed to detect upstream default branch"; exit 1 }
          $upstreamBranch = ($refLine -replace '^ref: refs/heads/','' -replace '\s+HEAD$','').Trim()
          git fetch https://github.com/nu774/fdkaac.git $upstreamBranch
          git checkout -B build-src FETCH_HEAD

      - name: Checkout fdk-aac source
        uses: actions/checkout@v4
        with:
          repository: mstorsjo/fdk-aac
          path: fdk-aac

      - name: Get versions
        shell: powershell
        run: |
          $fdkaacCommit = (git rev-parse HEAD).Trim()
          $fdkCommit = (git -C fdk-aac rev-parse HEAD).Trim()
          echo "SHA_FDKAAC=$fdkaacCommit" >> $env:GITHUB_ENV
          echo "SHA_FDK_AAC=$fdkCommit" >> $env:GITHUB_ENV
          
          $date = Get-Date -Format "yyyy-MM-dd_HH-mm"
          $fdkaacShort = $fdkaacCommit.Substring(0,7)
          $fdkShort = $fdkCommit.Substring(0,7)
          $tagName = "${date}_$fdkaacShort"
          $zipName = "fdkaac-windows-x64_fdkaac-$fdkaacShort`_libfdk-aac-$fdkShort.zip"
          
          echo "TAG_NAME=$tagName" >> $env:GITHUB_ENV
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Patch vcxproj for Static Runtime (/MT)
        shell: powershell
        run: |
          $projects = @("MSVC\fdkaac.vcxproj", "MSVC\fdk-aac.vcxproj")
          foreach ($proj in $projects) {
            $content = Get-Content $proj
            $newContent = $content -replace '<Optimization>MaxSpeed</Optimization>', "<Optimization>MaxSpeed</Optimization>`n      <RuntimeLibrary>MultiThreaded</RuntimeLibrary>"
            $newContent | Set-Content $proj -Encoding UTF8
          }

      - name: Create include directory
        shell: powershell
        run: |
          if (!(Test-Path "MSVC\include\fdk-aac")) {
              New-Item -ItemType Directory -Force -Path "MSVC\include\fdk-aac"
          }

      - name: Build solution
        run: msbuild MSVC\fdkaac.sln /p:Configuration=Release /p:Platform=x64

      - name: Verify build
        shell: powershell
        run: |
          $exe = "MSVC\x64\Release\fdkaac.exe"
          if (!(Test-Path $exe)) {
            Write-Error "fdkaac.exe not found at $exe"
            exit 1
          }
          & $exe --help
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "fdkaac --help returned exit code $code, ignoring to allow packaging"
          }
          exit 0

      - name: Install documentation tools
        shell: powershell
        run: |
          choco install pandoc --no-progress
          choco install wkhtmltopdf --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

      - name: Generate documentation
        shell: powershell
        run: |
          pandoc man\fdkaac.1 -f man -t html -s -o fdkaac.html
          pandoc man\fdkaac.1 -f man -t plain -o fdkaac.txt
          pandoc man\fdkaac.1 -f man -o fdkaac.pdf --pdf-engine=wkhtmltopdf
          pandoc man\fdkaac.1 -f man -t markdown -s -o fdkaac.md

      - name: Pack artifacts
        shell: powershell
        run: |
          Compress-Archive -Path MSVC\x64\Release\fdkaac.exe, fdkaac.html, fdkaac.txt, fdkaac.pdf, fdkaac.md -DestinationPath $env:ZIP_NAME

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Update upstream-version.json & Generate Notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA_FDKAAC: ${{ env.SHA_FDKAAC }}
          SHA_FDK_AAC: ${{ env.SHA_FDK_AAC }}
        run: |
          git fetch origin $DEFAULT_BRANCH
          git checkout $DEFAULT_BRANCH
          python .github/scripts/update_versions.py

      - name: Commit and Push upstream-version.json
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/upstream-version.json
          git commit -m "Update upstream-version.json [skip ci]" || echo "No changes to commit"
          git push origin $DEFAULT_BRANCH

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body_path: release_notes.md
          files: ${{ env.ZIP_NAME }}
